# SparseTSF (ICML'24), linear head - lss-1138/SparseTSF scripts/SparseTSF/linear/<dataset>.sh
# Values = exactly what the experiments use (L = 96).  Key "<dataset>@<H>" = only for that horizon,
# merged on top of "<dataset>".  Change a value in place, never by adding a second entry.
# Keys: sparsetsf_period_len = segment length (the period; smaller = larger model)

default: {lr: 0.02, loss: mse}
datasets:
  # LTSF (official scripts)
  ETTh1: {sparsetsf_period_len: 24, lr: 0.02}
  ETTh2: {sparsetsf_period_len: 24, lr: 0.03}
  ETTm1: {sparsetsf_period_len: 4, lr: 0.02}
  ETTm2: {sparsetsf_period_len: 4, lr: 0.02}
  Weather: {sparsetsf_period_len: 4, lr: 0.02}
  Exchange: {sparsetsf_period_len: 24, lr: 0.02}     # no official setting -> chosen on validation among the candidates (protocol.py)
  Electricity: {sparsetsf_period_len: 24, lr: 0.02}
  Traffic: {sparsetsf_period_len: 24, lr: 0.03}
  # industrial: period-type keys only (FFT period <= 48 / daily cycle, EXPERIMENT_PROTOCOL.md §5)
  Steel: {sparsetsf_period_len: 24}
  WindSCADA: {sparsetsf_period_len: 48}
  BlastFurnace: {sparsetsf_period_len: 48}
  MetroPT3: {sparsetsf_period_len: 24}
  N2O: {sparsetsf_period_len: 24}
  EWELD: {sparsetsf_period_len: 24}
