# Size-matched comparison (run.py --stage tune / final; see the paper, Section 4.1).
# Tiers (caps, not targets): "1k" = numbers stored on the chip (complex x2) <= 1,000 at the run's H, per dataset;
# "chip" = the real firmware fits 128 KB flash / 20 KB SRAM (built at the run's H with the dataset's channel count).
# The chip tier includes small models too: it asks "the best model this chip can hold".
#
# Every model is re-tuned with the SAME procedure (Brigato et al. TMLR 2026: Optuna TPE + successive halving,
# 40 trials, 15 epochs / patience 3, pick = lowest validation loss):
#   - one Optuna study per (tier, model, dataset, H): `tune.trials` trained trials, TPE seeded with `tune.seed`;
#     no author or frozen-FEATHer setting is a trial (FEATHer's frozen setting was developed on these data)
#   - shared ranges (`common`) for every model; a model-specific list only where the unit exists in that model alone
#   - which keys: every model option the official code exposes and the model reads is tuned (each paper's setting lies
#     inside the space), loss options included (the base loss is MSE; selection and test are MSE for every model);
#     the training procedure (Adam + cosine, epochs, L, batch) is common and fixed.  FEATHer on the
#     industrial data keeps its parts on (only sizes and training options; the parts are measured by the ablation
#     instead); on LTSF its part switches are tuned like the baselines' options (FEATHer_CI, one study)
#   - size: a trial samples a target size in (0, cap], one size key to fill and the other keys; the fill key takes the
#     value with the largest stored count <= target; a size key has no bound other than the tier (FEATHer's residual
#     MLP width: the designer's range, below).  A trial that cannot be built or does not fit the tier is not trained
#     and not counted (rejections are recorded)
#   - pick per study = the trial with the lowest validation loss; test is read once, in the final runs
#   - training protocol (L 96, batch 32, Adam + cosine, clip 1.0) is fixed for all, not searched

tiers: [1k, chip, ltsf, ltsf1k]   # ltsf = the chip rule on the LTSF datasets; the baselines are searched there too
# ltsf1k = the 1K rule on the LTSF datasets.
# LTSF datasets: Exchange left out (finance, not industry; as FITS / CMoS / PhaseFormer do).  Traffic and Electricity
# left out: their input window alone (96 x D floats: 862 -> 331 KB, 321 -> 123 KB) exceeds the F103's 20 KB SRAM for
# any model.
ltsf_data: [ETTh1, ETTh2, ETTm1, ETTm2, Weather]
tune:
  trials: 40                            # trained trials per study (rejected draws not counted)
  seed: 2025                            # TPE sampler seed and the training seed of every tuning run
  budget: {epochs: 15, patience: 3}     # Brigato's search budget
  pruner: {min_epochs: 3, reduction: 2} # successive halving, as Brigato
  max_rejects: 400                      # rejected draws in a row before a study stops (no setting fits)
final: {epochs: 50, patience: 10, seeds: [2025, 2026, 2027, 2028, 2029]}

common:
  lr: [1.0e-5, 1.0]                     # log-uniform, every model; covers the authors' values (CMoS 2e-5 .. TimeBase 0.4)
  dropout: [0.0, 0.05, 0.1, 0.2]
  switch: [false, true]
  mix: [0.1, 0.3, 0.5, 0.7, 0.9]        # weights between two terms / branches, defined on [0, 1]
  period: [2, 3, 4, 6, 8, 12, 16, 24, 48]   # divides L = 96 and every H, >= 2 segments
  segment: [1, 2, 3, 4, 6, 8, 12, 16, 24, 48]   # divides L = 96 and every H

# Every hyperparameter the wrapper reads, and how it is searched:
#   size    = count / width / depth: drawn from 1 .. the largest value that can fit (or filled)
#   {size: N} = the same, never above N
#   segment = segment length (common.segment)          period = common.period
#   switch / dropout / mix = the common lists           [list] = model-specific list (unit only in this model)
#   unused  = has no effect in this model as run (not searched; reason in the comment)
# A key that changes the stored count (size, segment, period) can be the fill key.
models:
  CMoS:
    cmos_seg_size: segment
    cmos_num_map: size
    cmos_kernel_size: size
    cmos_conv_stride: size
    cmos_use_pi: switch
    cmos_period: period                 # used by the period initialisation only
    cmos_dropout: dropout               # NO EFFECT: the official Model.py builds nn.Dropout but forward never calls it
                                        # (kept as drawn so the records match what ran; not in the paper's Table 2)
    # training procedure, fixed for every model: topk / step_size / gamma (config.toml)
  TimeBase:
    timebase_period_len: period
    timebase_basis_num: size
    timebase_individual: switch
    timebase_use_period_norm: switch
    timebase_use_orthogonal: switch
    timebase_orthogonal_weight: [0.01, 0.04, 0.08, 0.12, 0.16, 0.2, 0.64]   # loss weight with a unit of its own; 0.04-0.2 = scripts/*.sh
  PhaseFormer:
    phaseformer_period_len: period
    phaseformer_latent_dim: size
    phaseformer_layers: size
    phaseformer_routers: size
    phaseformer_heads: [1, 2, 4, 8]     # must divide latent_dim (otherwise drawn again); 8 = run_traffic.sh
    phaseformer_pos_embed: switch
    phaseformer_pos_dropout: dropout
    phaseformer_attn_dropout: dropout
    phaseformer_use_revin: switch
    phaseformer_revin_affine: switch    # no effect when RevIN is off
    phaseformer_enc_hidden: unused      # use_mlp is off in the official code: no parameters
    phaseformer_pred_hidden: unused     # (encoder / predictor use_mlp are not run.py options)
    phaseformer_attn_use_relpos: unused # passed to the attention but never used there (models/PhaseFormer.py)
    phaseformer_attn_window: unused     # same
    phaseformer_attention_dim: unused   # sets head_dim only, which nothing reads (authors' comment, line 55)
    phaseformer_revin_eps: unused       # numerical constant of RevIN, fixed at the authors' 1e-5 (every script)
    phaseformer_use_huber: switch       # Huber (delta 1.0, every script) instead of MSE; run.py default and the paper = Huber
  FITS:
    fits_cut_freq: size                 # <= L / 2 = 48 (the explicit value bypasses the wrapper clamp)
    fits_individual: switch
    fits_base_t: unused                 # only sets cut_freq when cut_freq is not given
    fits_h_order: unused                # same
    # training procedure, fixed for every model: train_mode (the authors' *_best.sh use 1 = loss on the forecast only)
  # SparseTSF = one study on every tier: its two heads (TPAMI 2026: linear, MLP) are a switch chosen on validation, as
  # FEATHer_CI's residual MLP on / off
  SparseTSF:
    sparsetsf_model_type: [linear, mlp] # which head
    sparsetsf_period_len: period
    sparsetsf_d_model: size             # MLP hidden width (mlp head only)
  MixLinear:
    mixlinear_period_len: period
    mixlinear_lpf: size                 # <= ceil(96 / period)
    mixlinear_alpha: [0.01, 0.1, 0.3, 0.5, 0.7, 0.9, 0.95, 0.99]   # common.mix + the authors' 0.01 / 0.95 / 0.99
  # FEATHer = FEATHer_core: channel-independent, core parts always on (2-3 bands, the input-adaptive gate, the residual
  # MLP, the SPK head); only sizes and training options are searched.
  FEATHer_core:
    period: period
    head_seg: segment
    mlp_rank: {size: 64}                # designer's range 1-64: each unit adds 3 stored numbers but 96 x D GELU calls
                                        # per forecast (F103: ~3-4 ms per unit per channel)
    point_kernel: size
    num_bands: [2, 3]                   # always split: 2 or 3 bands, chosen on validation
    use_residual_mlp: unused            # always on (frozen value)
    use_norm: switch
    agg_shared: switch
    gate_mode: unused                   # always the input-adaptive gate (frozen value: banded)
    head_mode: unused                   # always the SPK head (frozen value)
    lambda_spec: [0.0, 0.001, 0.01, 0.1]
    channel_mode: unused
  # LTSF only: FEATHer's parts are searched too (bands 1-3, gate on / off, SPK / linear head, residual MLP on / off),
  # in ONE study of 40 trials like every baseline (the core and no-MLP settings lie inside this space).  Its pick is
  # FEATHer's LTSF row.
  FEATHer_CI:
    period: period
    head_seg: segment                   # SPK segment length
    mlp_rank: {size: 64}                # width of the residual MLP (designer's range, as FEATHer_core)
    point_kernel: size                  # POINT band conv width (even widths cannot run)
    num_bands: [1, 2, 3]
    use_residual_mlp: switch            # residual MLP on / off (mlp_rank drawn only when on)
    use_norm: switch                    # RevIN
    agg_shared: switch                  # one SPK smoothing kernel for all channels
    gate_mode: [banded, none]           # band gate on / off
    head_mode: [spk, linear]            # linear head: no C port, so drawn then rejected on the chip rule ("no_c_port")
    lambda_spec: [0.0, 0.001, 0.01, 0.1]
    channel_mode: unused

# Small ablation of the main model (run.py --stage ablation -> results/mfg_ablation.csv).
# Each arm = the tuned pick of a (tier, dataset, H) with these keys set; it runs only where the pick differs
# (the search already turned a part off elsewhere), final seeds / epochs.  Judged on test MSE against the pick's
# own final rows.
ablation:
  nogate:  {gate_mode: none}           # band gate off (unweighted sum of the bands)
  oneband: {num_bands: 1}              # one band (the POINT conv) instead of 2 or 3
  staticgate: {gate_mode: static}      # input-independent learned band weights instead of the FFT gate
  nomlp:   {use_residual_mlp: false}   # residual MLP off, the rest of the chosen setting kept (not re-tuned)
  twoband: {num_bands: 2}            # runs only where 3 bands were chosen (no change elsewhere)
  threeband: {num_bands: 3}          # runs only where 2 bands were chosen (Steel 1K) -> every place shows 1 / 2 / 3
  linhead: {head_mode: linear}       # dense Linear(L, H) per channel; exceeds the budgets at long H (reported as cost)
# The band-separation loss weight is a training hyperparameter, not a part, so it has no ablation arm.
# (tier, dataset) places the arms run on; empty = all 12 (FEATHer_core always uses every part).
# The paper reports the three datasets from manufacturing plants (Table 1) under both budgets.
ablation_places: ["1k|Steel", "chip|Steel", "1k|EWELD", "chip|EWELD", "1k|BlastFurnace", "chip|BlastFurnace"]
