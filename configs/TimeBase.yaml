# TimeBase (ICML'25) - official scripts/<dataset>.sh (per H)
# Values = exactly what the experiments use (L = 96).  Key "<dataset>@<H>" = only for that horizon,
# merged on top of "<dataset>".  Change a value in place, never by adding a second entry.
# Keys: timebase_period_len = segment length | timebase_basis_num = number of basis series | timebase_orthogonal_weight = orthogonality loss weight | timebase_individual = one basis per channel

default: {lr: 0.1, loss: mse}
