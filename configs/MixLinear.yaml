  Exchange@336: {mixlinear_alpha: 0.99, mixlinear_lpf: 2}
  Exchange@720: {mixlinear_alpha: 0.99, mixlinear_lpf: 19}
  Electricity: {mixlinear_period_len: 24, lr: 0.03}
  Electricity@96: {mixlinear_alpha: 0.5, mixlinear_lpf: 19}
  Electricity@192: {mixlinear_alpha: 0.99, mixlinear_lpf: 15}
  Electricity@336: {mixlinear_alpha: 0.99, mixlinear_lpf: 15}
  Electricity@720: {mixlinear_alpha: 0.5, mixlinear_lpf: 15}
  Traffic: {mixlinear_period_len: 24, lr: 0.03}
